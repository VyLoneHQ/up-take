name: Feature request
description: Suggest an idea for UP-TAKE
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        UP-TAKE - a precisely engineered quality-of-life tool that streamlines your existing workflows.
        Everything it does is an area, a property of an area, or an action on one, and for each thing
        it does it has to be the best way to do that thing. Requests that fit that shape, and the
        "intentional capture, not surveillance" and "local-first" principles, are the best fit. It does
        not chase feature parity with other tools.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do today that's hard, slow, or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like UP-TAKE to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you've tried.
