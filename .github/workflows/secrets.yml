name: Secrets

# detect-secrets over every tracked file, and over the lines each new commit
# added. The second half is the one that matters on a public repository: a
# secret pushed in one commit and deleted in the next leaves a clean tree, and
# the commit that added it is still public. What the script reads, what passes,
# and what to do with a finding are in scripts/secret-scan.py's docstring.
#
# A workflow of its own, for two reasons the CI workflow cannot meet:
#
# - It runs on a push to ANY branch or tag, not only main. A branch or a tag
#   pushed to this repository is public whether or not a pull request is
#   opened for it (second review of #140, finding 3, for the tag).
# - Nothing cancels it. CI cancels a run when a newer push to the same branch
#   arrives. A cancelled run ends grey, not red, so a finding it was about to
#   report is never shown; and if the newer push was a force push that took
#   the cancelled push's commits off the branch, no later run reads them,
#   while GitHub still serves them by sha (review of #140, finding 3, and
#   round 3, finding 3).
#
# A daily run over every branch, for a push whose last commit carries a skip
# marker and so started no run, is not part of this workflow yet.
#
# Which commits a run reads is decided by the script from GitHub's own event
# file (`--github`), so no value from the event is pasted into a shell.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # `edited` too: a pull request whose base branch is changed has a new
  # range, and the default types would not read it (eleventh review).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so every commit of the range is here to read,
          # and refs/remotes/origin/main for a range measured from main.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Isolated (`-I`): `python -m` alone puts the current folder, the
      # checkout, first on the import path, so a `pip/` a pull request adds
      # ran in place of pip and could write a module into site-packages
      # before the scan (twelfth review of #140, finding 1).
      - name: Install detect-secrets
        run: python -I -m pip install detect-secrets==1.5.0 unidiff==0.7.5

      # Before the tests, and isolated (`-I`: no script folder, no PYTHON*
      # variables, no user site on the import path), so nothing a pull
      # request adds can stand in for a library the scan imports (eleventh
      # review of #140, finding 2). The pull request's code that runs up to
      # here is this workflow and the scan script, both code-owned; the steps
      # above it take nothing from the pull request (thirteenth review,
      # finding 2).
      - name: Scan the tracked files and the new commits
        run: python -I scripts/secret-scan.py --github

      # Each test plants a secret in a throwaway repository and asserts the
      # refusal, so the scan above is known to be able to go red.
      - name: Test the secret scan
        run: python scripts/test_secret_scan.py
