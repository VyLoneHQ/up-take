name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the in-flight run obsolete. Windows Tauri builds
# are slow enough that queueing them up serially is a real cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: lint, type-check, unit tests. Runs on Linux — no Windows APIs are
  # involved and the runner is several times faster.
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (format + lint)
        run: pnpm lint

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # This repository is public, so its source is public writing: comments,
      # doc comments and operator-visible strings included. A ratchet rather
      # than a gate, because the rule lands against 1,187 pre-existing sites
      # (this branch's tree at 914e920; main at 676ffde holds 1,189),
      # and a check that fails the build on the day it arrives is a check
      # somebody disables. The count may go down and never up.
      #
      # Steps in the web job rather than a job of their own: Python on a Linux
      # runner that is already required, so they cost no new check to register
      # in branch protection and no queue time on the Windows runners. Measured
      # locally: the ratchet is 0.3 s and the self-tests 10 s, the latter
      # because each of them initialises a git repository in a temp dir. This
      # comment said "a two-second Python run" and described only the first,
      # one commit after the second was added beneath it.
      # `--against origin/main` is what stops the ceiling being raised by hand,
      # and it needs main to be fetched. The checkout above is shallow, so the
      # ref is fetched explicitly rather than by setting fetch-depth: 0 on the
      # whole job, which would clone the full history for one comparison.
      - name: Fetch main for the ratchet's reference baseline
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      # Runs before the ratchet on purpose. The ratchet's own green is weak
      # evidence on the pull request that introduces it: `main` carries no
      # baseline yet, so the anti-tamper comparison has nothing to compare
      # against and cannot fire. An independent review made exactly that point.
      # These tests are the evidence instead, and each one was confirmed to go
      # red with the guard it covers removed.
      - name: Ratchet self-tests
        run: python3 scripts/test_dash_ratchet.py

      # The acquisition step's own tests. They build synthetic archives rather
      # than downloading the real 80 MB release, so they cost nothing here and
      # still cover the invariant round 1 of I-337's review found broken:
      # nothing is staged unless EVERY member passes its pin.
      - name: Test the ONNX Runtime acquisition step
        run: python3 scripts/test_acquire_onnxruntime.py

      # The bundle checker's own tests (I-346). Synthetic assets and a synthetic
      # pins file in a temp directory, with the module's tables rebound at them,
      # so they need none of the 31 MB this job does not have. Here for the same
      # reason as the two steps above it: a fast Python run on a Linux runner
      # that is already required, so it costs no new check to register in branch
      # protection and no queue time on the Windows runners.
      #
      # ⚠️ An earlier version of this comment claimed the placement was
      # load-bearing -- that the failure modes "have to be exercised somewhere
      # the real bytes are ABSENT". **That is false and the independent review
      # of PR #86 measured it**: the fixtures make every assertion independent
      # of the surrounding job, and the reviewer ran the suite with the real
      # assets present and absent, 8/8 both times. The step would work in the
      # bundle job too. The honest reason is cost and consistency, and a comment
      # that dresses a convenience up as a constraint is how a later session
      # refuses to move something for a reason that was never true.
      - name: Test the bundle checker
        run: python3 scripts/test_verify_bundle.py

      # The DETECTOR acquisition step's own tests (ADR-0036). Its sibling
      # `acquire-onnxruntime.py` has had tests since I-337's review found its
      # central invariant broken; this script shipped without any, and round 1
      # of PR #88's review classified that as BEHAVIOUR rather than an omission
      # -- correctly, because the property the whole provenance story rests on
      # ("nothing that fails a check reaches the staging directory") was true
      # when drilled by hand and protected by nothing afterwards.
      #
      # Synthetic payloads and a synthetic pins file, so they need none of the
      # 9.8 MB this job does not have.
      - name: Test the PP-OCRv6 detector acquisition step
        run: python3 scripts/test_acquire_ppocr_detector.py

      # The recogniser step's own tests. Same shape and same reason: synthetic
      # pins and synthetic payloads, so they need no model, no download and no
      # onnxruntime, and they behave identically whether or not it is installed
      # -- a suite that skips depending on the environment is UT-F-101.
      # PyYAML because the extraction is a real YAML parse now: PR #89 round 1
      # found the hand-rolled one corrupted two of 18,708 entries, with every
      # digest around it certifying the corruption rather than detecting it.
      - name: Install PyYAML for the card and recogniser suites
        run: python3 -m pip install PyYAML

      - name: Test the PP-OCRv6 recogniser acquisition step
        run: python3 scripts/test_acquire_ppocr_recogniser.py

      # Holds the Python name guard to the Rust one it duplicates. There are two
      # implementations of one rule because the Rust guards what the PRODUCT
      # installs and the Python guards what the BUILD stages, in different
      # languages and different processes, and neither can import the other.
      # Round 5 of PR #88 found the Python was the strictly weaker of the two
      # and was the one guarding a write. This control reads the reserved-name
      # list out of manifest.rs and fails if they diverge.
      - name: Rust and Python name guards agree
        run: python3 scripts/control-rust-consts.py

      # The licence notice's own tests. The load-bearing one reads
      # tauri.release.conf.json and asserts the notice names exactly the model
      # files the installer bundles, in both directions.
      - name: Test the model licence notice
        run: python3 scripts/test_write_model_notice.py

      - name: Em-dash ratchet
        run: python3 scripts/dash-ratchet.py --against origin/main

  # ---------------------------------------------------------------------------
  # Rust: format, lint, test. Windows because uptake-capture and the window
  # layer are Windows-only — checking on Linux would not compile the code that
  # actually ships.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain version comes from rust-toolchain.toml; rustup honours it
      # automatically. Components (clippy, rustfmt) are declared there too.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # Run from the repository root: the Cargo workspace lives there now, so
      # --all/--all-targets covers src-tauri and every crates/ member. Running
      # inside src-tauri would silently check only one member.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The same lint pass in the release configuration, because the two do not
      # check the same code. `cfg(debug_assertions)` gates a real amount of this
      # codebase — the whole dev_harness module, the gesture instrumentation, the
      # state-transition logging — so anything reachable only from a debug-only
      # caller is dead code in release and invisible to the step above.
      #
      # Added 2026-07-27 after exactly that happened: `start` was unused and
      # `take_latency_summary` was dead in release from 01587e4 until the task
      # 1.9b review, and nothing failed. The build job compiles release but does
      # not pass -D warnings, so warnings there are printed and ignored.
      #
      # Cheap in practice: rust-cache keeps the release artefacts warm across
      # runs, and this shares a checkout and a toolchain with the debug pass.
      - name: cargo clippy (release)
        run: cargo clippy --release --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      # The same suite in the release configuration, for the reason the clippy
      # pair above already gives, applied to behaviour rather than to lints.
      #
      # Added 2026-08-11 by the independent review of the `I-42` switch, which
      # found it by mutation rather than by reading. `output::REPORT_EVERY_ACTION`
      # starts at `cfg!(debug_assertions)`, so in a debug build it is `true`
      # whatever the code says. Replacing its initializer with a bare
      # `AtomicBool::new(true)`, a shipped build logging a line on every grab,
      # which is the one outcome that backlog row forbids by name, left the suite
      # fully green, and so did inverting the condition that arms the switch. No
      # assertion in a debug build can separate those, because the value under
      # test is the same either way.
      #
      # The general rule: a guarantee about a release build has to be checked in
      # one, and any `cfg(debug_assertions)` default is invisible to the step
      # above by construction.
      - name: cargo test (release)
        run: cargo test --release --all-features

  # ---------------------------------------------------------------------------
  # Supply chain: licence policy and security advisories.
  #
  # This is the job that keeps UP-TAKE distributable under GPL-3.0. deny.toml
  # is an allow-list, so any dependency introducing an incompatible licence —
  # AGPL-3.0 in particular — fails here. See MASTER-PLAN R-3.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain (deny, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Both tools now resolve the whole workspace from the root manifest and
      # the root Cargo.lock, so a licence-incompatible dependency pulled in by
      # any member fails here — not just one introduced by src-tauri.
      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny --config deny.toml check

      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Build the installer and publish an SBOM. Unsigned for now — code signing
  # lands in Phase 3 once SignPath approval is in place.
  # ---------------------------------------------------------------------------
  build:
    name: Build (Windows, unsigned)
    runs-on: windows-latest
    needs: [web, rust, supply-chain]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-0035: the ONNX Runtime and the PP-OCRv4 models ship INSIDE the
      # installer, and `bundle.resources` in tauri.release.conf.json names them
      # (merged in with --config at the build step below; it is deliberately NOT
      # in tauri.conf.json, because tauri-build validates resource paths at
      # compile time). They
      # are ~31 MB of binaries acquired rather than committed, so a checkout
      # alone cannot build a bundle and these two steps are what make it
      # possible. Each verifies every byte against a pinned SHA-256 before
      # writing (ADR-0032 decision 2), so a tampered or moved upstream artifact
      # fails the build rather than reaching an installer.
      #
      # The build is DELIBERATELY not made to work without them. An installer
      # with no runtime and no models is one whose OCR reports itself
      # unavailable to every user, and that failure is far quieter than a red
      # CI step here.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Acquire ONNX Runtime (pinned, checksummed)
        run: python scripts/acquire-onnxruntime.py --out src-tauri/assets

      # Pinned exactly: paddle2onnx 2.1.0's C extension fails to load on Windows
      # and 1.3.1 is the newest release that converts these artifacts here. The
      # script asserts the version it finds, so a drift is a refusal rather than
      # a silently different conversion.
      # onnxruntime because both acquisition steps pass --require-onnxruntime,
      # which makes their shape and class checks a REFUSAL here rather than the
      # skip they are on a developer's machine (PR #89 round 1, F4). PyYAML
      # because the dictionary is a real YAML parse (F1). paddle2onnx is GONE:
      # ADR-0037 took the recogniser to Baidu's own ONNX, so nothing converts.
      - name: Install the acquisition toolchain
        run: python -m pip install onnxruntime PyYAML

      # Built from the PINS, which are the same constants the installer's
      # resources map and verify-bundle.py read. PR #89 round 1 F2 found the
      # old notice naming two files nobody receives and omitting two that
      # ship -- an Apache-2.0 section 4 defect that cargo deny cannot see,
      # because it walks the crate graph and sees no .onnx.
      - name: Write the model licence notice
        run: python scripts/write-model-notice.py --out src-tauri/assets/models

      # The RECOGNISER, downloaded rather than converted (ADR-0037). Its
      # dictionary is EXTRACTED from the model's own inference.yml, because
      # PP-OCRv6 does not publish the character list standalone the way v4 did
      # -- so DICTIONARY_SHA256 pins this repository's extraction rather than a
      # file Baidu publishes, and the script re-derives it every run.
      - name: Acquire the PP-OCRv6 recogniser (pinned, checksummed)
        run: python scripts/acquire-ppocr-recogniser.py --out src-tauri/assets/models --require-onnxruntime

      # The DETECTOR is downloaded rather than converted (ADR-0036): Baidu
      # publishes PP-OCRv6 as ONNX itself, and ADR-0037 took the recogniser the
      # same way. Two steps rather than one because they are two artifacts with
      # two pins, and each refuses independently.
      #
      # ⚠️ THE ORDERING PARAGRAPH THAT STOOD HERE IS GONE, and so is what it
      # described. It explained that the conversion step wrote the notice and
      # printed a NOTE when the detector was not staged yet. The notice is now
      # written by write-model-notice.py from the PINS, and nothing converts:
      # PR #89 round 1 F2 found the old notice naming two files nobody receives
      # and omitting the two that ship. Order still does not matter, and now
      # there is no note to silence.
      - name: Acquire the PP-OCRv6 detector (pinned, checksummed)
        run: python scripts/acquire-ppocr-detector.py --out src-tauri/assets/models --require-onnxruntime

      # `--config` MERGES the release-only bundle resources into the base
      # config. They are deliberately not in `tauri.conf.json`: `tauri-build`
      # validates resource paths at COMPILE time, so putting them there makes
      # every `cargo check`/`clippy`/`test` require 31 MB of acquired assets.
      - name: Build application
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      # Checks the ARTIFACT, not the invocation, and that distinction is the
      # whole point. `tauri build` WITHOUT the --config above exits 0 and
      # produces a 2.27 MB installer carrying no runtime, no models and none of
      # the three notices -- measured, not feared. Every other gate stays green
      # through that, because nothing else looks at what came out.
      #
      # So this cannot be routed around by a future release workflow that
      # forgets the flag, which is what a check on the command line would be.
      - name: Verify the bundle carries the runtime, the models and the notices
        run: python scripts/verify-bundle.py

      # cargo-sbom publishes no Windows binary, so it is compiled here and
      # cached on its pinned version.
      - name: Cache cargo-sbom
        id: cache-sbom
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-sbom.exe
          key: cargo-sbom-0.10.0-${{ runner.os }}

      - name: Install cargo-sbom
        if: steps.cache-sbom.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-sbom@0.10.0

      # bash, not pwsh: PowerShell redirection can re-encode stdout, and the
      # SBOM has to stay valid UTF-8 JSON.
      - name: Generate SBOM (CycloneDX)
        working-directory: src-tauri
        shell: bash
        run: cargo sbom --output-format cyclone_dx_json_1_6 > ../up-take-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: up-take-sbom.cdx.json
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: up-take-windows-unsigned
          # A workspace shares one target directory at the root, so the bundles
          # are no longer under src-tauri/.
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
