[package]
name = "up-take"
description = "UP-TAKE - Grab, reshape and reuse anything on your screen. Pin any part of your Windows screen as an area that stays while you work; free, local, GPL-3.0-or-later."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Kept deliberately thin: Tauri commands, window lifecycle, tray. Business logic
# belongs in the crates/ members — see the workspace manifest.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "up_take_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uptake-core = { workspace = true }
uptake-capture = { workspace = true }
# Roadmap 1.26 gave the OCR engine its first caller in the product. `uptake-ocr`
# owns the engine and its worker thread; `uptake-assets` owns the pinned digests
# this host verifies the models against before loading them (ADR-0032 D2).
uptake-ocr = { workspace = true }
uptake-assets = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uptake-log = { workspace = true }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
# Windows APIs called directly:
#   - display_watch.rs: comctl32 window subclassing (Win32_UI_Shell) for
#     WM_DISPLAYCHANGE.
#   - placement.rs: the WH_MOUSE_LL hook, SetSystemCursor, and GetModuleHandleW
#     (Win32_System_LibraryLoader) for live-placement input (ADR-0014).
#   - overlay.rs: SetWindowDisplayAffinity (ADR-0019).
#   - freeze.rs: DwmFlush (Win32_Graphics_Dwm), so a freeze captures only
#     after the page's hidden drawing has reached the screen (ADR-0019
#     decision 6, backlog I-411 and I-426).
#   - output.rs: the clipboard (Win32_System_DataExchange), GlobalAlloc
#     (Win32_System_Memory), and GetLocalTime (Win32_System_SystemInformation)
#     for the output pipeline (task 1.9).
#   - strings.rs: GetUserDefaultUILanguage (Win32_Globalization), the
#     display language UP-TAKE's words follow (roadmap 1.38).
# tao already pulls windows-sys transitively; this makes the usage explicit and
# feature-gated to exactly what we call.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  # freeze.rs: DwmFlush waits until the page's hidden drawing has been
  # presented before a freeze captures (ADR-0019 decision 6, I-411, I-426).
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  # autostart.rs: the per-user Run key, which is the whole of ADR-0044's
  # "start with Windows" registration (roadmap 1.14, backlog I-391).
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  # dev_harness.rs: SetThreadDpiHostingBehavior, for roadmap 1.35 gate 1's
  # measurement (UPTAKE_DEV_DPI_HOSTING). Debug builds call it; release builds
  # link the feature and call nothing.
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The PNG encoder task 1.7's grab.rs example already validated (WIC-backed,
# no new codec to vet) — reused rather than adding a second PNG dependency.
windows-capture = { workspace = true }

[lints]
workspace = true
