[package]
name = "up-take"
description = "AI-powered screen intelligence overlay for Windows. Capture, OCR, understand — locally."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Kept deliberately thin: Tauri commands, window lifecycle, tray. Business logic
# belongs in the crates/ members — see the workspace manifest.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "up_take_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uptake-core = { workspace = true }
uptake-capture = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
# Windows APIs called directly:
#   - display_watch.rs: comctl32 window subclassing (Win32_UI_Shell) for
#     WM_DISPLAYCHANGE.
#   - placement.rs: the WH_MOUSE_LL hook, SetSystemCursor, and GetModuleHandleW
#     (Win32_System_LibraryLoader) for live-placement input (ADR-0014).
#   - overlay.rs: SetWindowDisplayAffinity (ADR-0019).
#   - output.rs: the clipboard (Win32_System_DataExchange), GlobalAlloc
#     (Win32_System_Memory), and GetLocalTime (Win32_System_SystemInformation)
#     for the output pipeline (task 1.9).
# tao already pulls windows-sys transitively; this makes the usage explicit and
# feature-gated to exactly what we call.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The PNG encoder task 1.7's grab.rs example already validated (WIC-backed,
# no new codec to vet) — reused rather than adding a second PNG dependency.
windows-capture = "2.0"

[lints]
workspace = true
