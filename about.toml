# cargo-about's configuration: the Rust half of THIRD-PARTY-NOTICES.txt (I-443).
#
# MIT, Apache-2.0, BSD and the rest require their copyright and permission
# notices to travel with every copy, binaries included, so the installer
# carries one file listing every crate compiled into UP-TAKE with its licence
# text. scripts/write-third-party-notices.py generates it at build time from
# Cargo.lock, never by hand, so a Dependabot bump cannot leave it stale.

# The licences cargo-about may report. The same list as deny.toml's [licenses]
# allow, which is the gate on what may be compiled in at all; a licence missing
# here fails the notices step rather than being dropped from the file.
accepted = [
  "GPL-3.0",
  "GPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
]

# Windows only, as deny.toml's graph is: a crate compiled only for another
# target is not in the binary a user receives.
targets = ["x86_64-pc-windows-msvc"]

# Test-only crates are never in the binary.
ignore-dev-dependencies = true

# UP-TAKE's own crates are publish = false and GPL-3.0; the GPL's text ships
# beside this file as LICENSE.txt, so they are not listed again.
private = { ignore = true }
