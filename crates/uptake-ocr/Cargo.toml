# uptake-ocr -- the OCR subsystem: a background inference thread and the seam
# an engine plugs into.
#
# Platform-independent by design (architecture.md section 2), which is why it is
# a crate rather than a module inside src-tauri: it is testable without a window,
# and keeping the Windows surface confined to uptake-capture and src-tauri is
# what makes the stated macOS/Linux ambition survivable rather than aspirational.
#
# ONNX Runtime arrives through `ort`, taken with default-features = false and
# the `load-dynamic` feature -- ADR-0032, accepted 2026-08-27. The default
# feature set would fetch a prebuilt runtime from a CDN at BUILD time; this
# loads one we placed, at run time. The exact version pin lives in the workspace
# manifest and is deliberate: `ort` has no stable release.
#
# (This comment read "NO ONNX RUNTIME DEPENDENCY HERE YET" until 2026-08-30,
# which was true of roadmap 1.10 and false the moment 1.11 landed.)

[package]
name = "uptake-ocr"
description = "The OCR background inference thread, and the engine seam a recogniser plugs into. No platform APIs."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
uptake-core = { workspace = true }
thiserror = { workspace = true }
ort = { workspace = true }

[lints]
workspace = true

# `test = true` so `cargo test --all-features` runs the accuracy harness's own
# unit tests. An example defaults to `test = false`, which compiles its
# `#[cfg(test)]` module and never runs it -- and the module in question verifies
# the edit-distance metric that produces every figure the harness prints. An
# unverified metric is worse than no metric, because it reports.
#
# The example itself is NOT run by this: it needs a runtime, two models and a
# dictionary CI does not have. Only its test module runs.
[[example]]
name = "ocr_accuracy"
test = true
