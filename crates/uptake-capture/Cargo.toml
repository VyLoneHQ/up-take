# uptake-capture — Windows Graphics Capture (WGC) of screen regions.
#
# The Windows-specific capture surface, isolated here per architecture.md §2 so
# the platform-independent crates never touch a Windows API. Depends on
# siblings only through uptake-core types (Rect in, RgbaBitmap out).
#
# WGC is the primary path (wgc.rs); gdi.rs is the fallback for monitors WGC
# cannot deliver a frame for (task 1.8).

[package]
name = "uptake-capture"
description = "One-shot Windows Graphics Capture of virtual-desktop regions into RGBA bitmaps."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
uptake-core = { workspace = true }
thiserror = { workspace = true }

[target."cfg(windows)".dependencies]
# The WGC wrapper the 2026-07-22 capture spike validated on the dev rig
# (first frame ~90 ms, hardware-overlay video captured crisply — ADR-0014).
# MIT-licensed; verified against deny.toml's allow-list.
windows-capture = { workspace = true }
# Win32 APIs called directly:
#   - monitors.rs: EnumDisplayMonitors (monitor rects + HMONITORs)
#   - wgc.rs: PeekMessageW/PostThreadMessageW (timeout escape for a capture
#     thread whose frame never arrives) and GetCurrentThreadId
#   - gdi.rs: GetDC/BitBlt/CreateDIBSection et al. (the WGC-unavailable
#     fallback: BitBlt the screen DC into a top-down DIB)
#   - examples/grab.rs and tests: SetProcessDpiAwarenessContext, because
#     monitor coordinates are physical only in a per-monitor-DPI-aware process
#   - examples/warm_session.rs: GetProcessTimes/GetSystemTimes (the CPU cost of
#     a held session) and GetProcessMemoryInfo (its RAM cost)
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# quality-bars.md §2: coordinate math gets property tests. The capture plan
# (region ∩ monitors → per-monitor crops and output offsets) is coordinate math.
proptest = { workspace = true }

[target."cfg(windows)".dev-dependencies]
# examples/warm_session.rs only (task 1.9f's spike): retaining a WGC frame as a
# GPU texture means handling the D3D11 interfaces windows-capture exposes, and
# those are COM types from the `windows` crate rather than windows-sys. Not a
# dependency of the library itself — nothing in src/ touches D3D11 directly.
windows = { workspace = true, features = [
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
